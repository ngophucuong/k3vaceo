name: Deploy lên Cloudflare

# Đẩy code lên nhánh làm việc là tự deploy. Bấm tay được ở tab Actions khi cần
# deploy lại mà không có thay đổi nào.
#
# ĐỔI NHÁNH LÀM VIỆC THÌ PHẢI SỬA DÒNG `branches` DƯỚI ĐÂY. Ngày 28/8 nhánh
# chuyển sang claude/content-deployment-continuation-m2inni mà dòng này còn ghi
# nhánh cũ, nên bốn commit liền KHÔNG deploy — không lỗi, không cảnh báo, chỉ
# là tab Actions im lặng và tên miền vẫn chạy bản cũ. Triệu chứng duy nhất là
# người dùng bảo "vào không thấy gì mới".
on:
  push:
    branches: [claude/content-deployment-continuation-m2inni]
    paths-ignore: ['**.md', '.github/nap-du-lieu.trigger', '.github/phat-link-moi.trigger', '.github/kiem-tra-email.trigger']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ĐÂY LÀ NHÁNH PRODUCTION CỦA CLOUDFLARE PAGES, KHÔNG PHẢI NHÁNH GIT.
      # Hai thứ tình cờ cùng tên lúc dựng dự án, nhưng chúng khác nhau về bản
      # chất: `branches:` ở trên quyết định workflow có CHẠY không, còn giá trị
      # này quyết định bản vừa đẩy có thành PRODUCTION không.
      #
      # Cloudflare Pages chỉ coi một lượt deploy là production khi --branch
      # TRÙNG với nhánh production đã cấu hình trong dự án. Đổi giá trị này
      # theo nhánh git mới thì lượt deploy tụt xuống hạng "xem thử": workflow
      # vẫn xanh, log vẫn báo thành công, mà k3vaceo.cuongngo.app vẫn phục vụ
      # bản cũ. Muốn đổi thật thì phải đổi trong bảng điều khiển Pages trước.
      NHANH_PAGES: claude/read-content-deployment-plan-dpsv8m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Chưa đặt bí mật thì BỎ QUA chứ không báo hỏng — deploy bằng Git
      # integration ngay trên dashboard Cloudflare cũng là đường hợp lệ, và ai
      # chọn đường đó thì không phải nhìn dấu X đỏ ở mỗi commit.
      #
      # database_id KHÔNG còn nằm trong danh sách bí mật: nó đã được điền thẳng
      # vào worker/wrangler.toml, vì Cloudflare cũng đọc tệp đó khi deploy từ
      # dashboard. Để hai nơi là có ngày lệch nhau.
      - name: Kiểm tra đã có đủ bí mật chưa
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa đặt bí mật Cloudflare nên bỏ qua deploy. Xem README mục 'Deploy tự động từ GitHub'."
          fi

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      # Dữ liệu gốc đã nạp bằng workflow "Nạp dữ liệu vào D1", và bảng
      # d1_migrations đã ghi đủ sáu migration, nên bước này hiện là không-làm-gì.
      # Giữ lại để migration MỚI sau này tự áp khi deploy.
      - name: Áp migration mới (nếu có) lên D1 thật
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply k3vaceo --remote

      # ── Pages trước, Worker sau ────────────────────────────────────────────
      # Bản ghi DNS của k3vaceo.cuongngo.app do Pages custom domain tạo ra.
      # Worker Route chỉ chen được vào một hostname đã có bản ghi DNS.
      - name: Tạo project Pages nếu chưa có
        if: steps.check.outputs.skip != 'true'
        run: |
          npx wrangler pages project create k3vaceo --production-branch="$NHANH_PAGES" \
            || echo "Project đã tồn tại, bỏ qua."

      - name: Deploy Pages (giao diện)
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler pages deploy public --project-name=k3vaceo --branch="$NHANH_PAGES" --commit-dirty=true

      # Tải mã Worker lên là quyền cấp ACCOUNT; tạo Worker Route là quyền cấp
      # ZONE — hai thứ khác nhau, Workers Scripts:Edit không kéo theo. Thiếu
      # quyền zone thì mã vẫn lên được, chỉ route là không. Ở đây KHÔNG chết
      # ngay: ghi nhận rồi chạy tiếp để bước kiểm tra cuối vẫn nói được tình
      # hình thật của tên miền. Cuối job mới đánh hỏng.
      - name: Deploy Worker (API)
        id: worker
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        run: |
          set -o pipefail
          if npx wrangler deploy --var COMMIT_SHA:"$GITHUB_SHA" 2>&1 | tee /tmp/worker.log; then
            echo "route_loi=" >> "$GITHUB_OUTPUT"
          elif grep -q 'workers/routes' /tmp/worker.log; then
            echo "route_loi=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Mã Worker đã tải lên nhưng KHÔNG tạo được Worker Route. API token thiếu quyền cấp zone cho cuongngo.app: Zone → Workers Routes → Edit. Chạy tiếp để xem tình hình tên miền."
          else
            echo "::error::Deploy Worker hỏng vì lý do khác route — xem log phía trên."
            exit 1
          fi

      # Đây là chỗ ĐÁNG TIN NHẤT để đặt cấu hình SMTP. Lý do: `wrangler deploy`
      # ghi đè toàn bộ `vars` bằng đúng những gì có trong wrangler.toml, nên
      # biến plaintext đặt tay trên dashboard bị xoá sau mỗi lần deploy. Chỉ
      # Secret mới sống sót — và đồng bộ ở đây thì lần deploy nào cũng có lại.
      #
      # Nhận cả hai bộ tên: bộ ngắn (SMTP_USER/SMTP_PASS/MAIL_FROM) và bộ dài
      # (SMTP_USERNAME/SMTP_PASSWORD/SMTP_FROM_EMAIL) hay gặp ở bảng điều khiển
      # nhà cung cấp hosting. mailer.js đọc được cả hai.
      - name: Đồng bộ bí mật SMTP cho Worker
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

        run: |
          da=
          # Duyệt hết rồi bỏ qua cái nào chưa đặt, thay vì dừng sớm khi thiếu
          # SMTP_HOST: bản cũ làm thế, nên ai chỉ đặt khoá VAPID mà chưa đặt
          # SMTP sẽ không bao giờ được đồng bộ khoá đẩy — thông báo im lặng
          # không chạy, và chỗ hỏng nằm ở một workflow chứ không ở mã.
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE \
                      SMTP_USER SMTP_PASS MAIL_FROM \
                      SMTP_USERNAME SMTP_PASSWORD SMTP_FROM_EMAIL \
                      RESEND_API_KEY \
                      VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            # Bỏ qua cái không đặt: đẩy chuỗi rỗng lên là tạo ra một bí mật rỗng,
            # trông như "đã có" mà thực ra không dùng được.
            [ -z "${!name}" ] && continue
            printf '%s' "${!name}" | npx wrangler secret put "$name" >/dev/null
            da="$da $name"
          done
          [ -n "$da" ] && echo "✓ đã đồng bộ:$da" \
            || echo "Không có bí mật nào trong GitHub — giữ nguyên bí mật đã đặt trên Cloudflare." 

      # Chứng chỉ SSL của custom domain mất vài phút mới cấp xong, nên thử lại
      # vài lượt chứ đừng kết luận vội. Và phân biệt cho rõ: trả về JSON là
      # Worker Route đã chen được vào; trả về HTML là request rơi xuống Pages
      # (vì _redirects có luật bắt tất cả /* → /index.html).
      - name: Kiểm tra tên miền thật
        id: kiemtra
        if: steps.check.outputs.skip != 'true'
        run: |
          # Chờ tới khi /api/health trả về ĐÚNG BẢN VỪA DEPLOY, không phải chỉ
          # chờ HTTP 200. Cloudflare mất vài chục giây để lan bản mới ra rìa
          # mạng, mà bước này chạy chỉ 8 giây sau lệnh deploy — bản cũ vẫn trả
          # 200 ngon lành. Lần trước chính chỗ này in "đã chạy thật" trong khi
          # đo trúng bản trước đó. Có đo được version thì mới nói được câu ấy.
          khop=0
          for lan in $(seq 1 12); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
                   -H 'Accept: application/json' \
                   https://k3vaceo.cuongngo.app/api/health || echo 000)
            ver=$(node --input-type=commonjs -e '
              try {
                const d = JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8"));
                process.stdout.write(String(d.version || ""));
              } catch { process.stdout.write(""); }
            ' 2>/dev/null)
            echo "lần $lan: HTTP $code · bản đang chạy ${ver:-(chưa ghi)}"
            if [ "$code" = "200" ] && [ "$ver" = "$GITHUB_SHA" ]; then khop=1; break; fi
            [ "$lan" = "12" ] || sleep 15
          done
          if [ "$code" = "200" ] && [ "$khop" != "1" ]; then
            echo "::warning::Tên miền sống nhưng /api/health vẫn trả bản ${ver:-(chưa ghi)} chứ không phải $GITHUB_SHA sau 3 phút. Những dòng ✓ dưới đây đo trên BẢN CŨ — chưa chứng minh được bản vừa deploy đã lên."
          fi
          echo "--- nội dung nhận được (2000 ký tự đầu) ---"
          head -c 2000 /tmp/health.json 2>/dev/null; echo

          if [ "$code" != "200" ]; then
            echo "::warning::/api/health chưa trả 200 (HTTP $code). Nếu custom domain còn 'pending' thì chờ Cloudflare cấp chứng chỉ rồi chạy lại."
            exit 0
          fi

          if ! head -c 1 /tmp/health.json | grep -q '{'; then
            echo "::warning::Tên miền sống rồi nhưng /api/health trả về HTML chứ không phải JSON — request rơi xuống Pages, tức Worker Route CHƯA chen vào được."
            exit 0
          fi

          # Chứng minh kiến trúc "Pages phục vụ giao diện + Worker Route cướp
          # /api/*" thật sự hoạt động trên cùng một hostname. Ba phép thử:
          echo "--- giao diện (/) phải là HTML của Pages ---"
          curl -s https://k3vaceo.cuongngo.app/ -o /tmp/trang.html
          if grep -q '<title>k3vaceo</title>' /tmp/trang.html; then
            echo "✓ / trả về giao diện từ Pages"
          else
            echo "::error::/ không trả về giao diện mong đợi."; head -c 500 /tmp/trang.html; exit 1
          fi

          echo "--- đường dẫn SPA (/nhom) cũng phải ra giao diện, không phải 404 ---"
          spa=$(curl -s -o /dev/null -w '%{http_code}' https://k3vaceo.cuongngo.app/nhom)
          echo "  HTTP $spa $([ "$spa" = "200" ] && echo '✓' || echo '✗ (luật _redirects chưa ăn)')"

          # Đường dẫn /api lạ phải do WORKER trả lời, không phải Pages. Điều cần
          # khẳng định là "thân trả về là JSON", chứ không phải một mã HTTP cụ
          # thể: middleware xác thực chạy trước nhánh 404 nên đường dẫn lạ ra
          # 401 not_authenticated chứ không ra 404. Bắt đúng 404 là bắt sai.
          echo "--- /api/khong-co-that phải do Worker trả lời (JSON), KHÔNG phải index.html ---"
          ma=$(curl -s -o /tmp/la.json -w '%{http_code}' https://k3vaceo.cuongngo.app/api/khong-co-that)
          echo "  HTTP $ma — $(head -c 200 /tmp/la.json)"
          if ! head -c 1 /tmp/la.json | grep -q '{'; then
            echo "::error::Worker Route không phủ hết /api/* — đường dẫn lạ rơi xuống Pages (nhận được HTML)."; exit 1
          fi
          echo "✓ Worker Route phủ toàn bộ /api/*"

          # Đệm của Pages quyết định người dùng có nhận được bản mới hay không.
          # Không đoán: in ra để đọc. app.js và app.css KHÔNG có ?v= nên nếu
          # chúng được đệm lâu thì sửa mã xong người ta vẫn chạy bản cũ.
          # Deploy xanh mà người dùng vẫn thấy giao diện cũ — đúng chuyện xảy ra
          # ngày 28/8. Mọi phép kiểm cũ đều đậu (giao diện có trả về, API chạy),
          # vì không phép nào hỏi "app.js trên tên miền CÓ PHẢI bản vừa đẩy
          # không". So bằng băm, không so bằng một chuỗi đánh dấu: chuỗi thì
          # phải nhớ sửa mỗi lần, còn băm thì đúng cho mọi commit.
          echo "--- app.js trên tên miền có đúng bản vừa đẩy không ---"
          bam_local=$(sha256sum public/app.js | cut -c1-16)
          curl -s -o /tmp/aj-thuong.js  https://k3vaceo.cuongngo.app/app.js || true
          curl -s -o /tmp/aj-tuoi.js -H 'Cache-Control: no-cache' \
               https://k3vaceo.cuongngo.app/app.js || true
          bam_thuong=$(sha256sum /tmp/aj-thuong.js 2>/dev/null | cut -c1-16)
          bam_tuoi=$(sha256sum /tmp/aj-tuoi.js 2>/dev/null | cut -c1-16)
          echo "  trong repo      : $bam_local"
          echo "  tải bình thường : ${bam_thuong:-(hỏng)}"
          echo "  tải ép làm mới  : ${bam_tuoi:-(hỏng)}"
          if [ "$bam_tuoi" != "$bam_local" ]; then
            # Ép làm mới mà VẪN khác repo thì Pages chưa xuất bản thật. Đây là
            # hỏng thật, không phải chuyện đệm — đánh đỏ.
            echo "::error::Pages chưa xuất bản public/app.js của commit này. Ép làm mới vẫn ra bản khác."
            loi=1
          elif [ "$bam_thuong" != "$bam_local" ]; then
            # Bản thật đã lên, nhưng lượt tải bình thường vẫn ra bản cũ: đệm.
            # CẢNH BÁO chứ không đánh đỏ — nút bấm nằm ngoài repo (Browser Cache
            # TTL cấp zone), mà đánh đỏ mọi lượt deploy vì một nút bấm ngoài tầm
            # với chỉ dạy người ta bỏ qua màu đỏ.
            echo "::warning::app.js MỚI đã lên tên miền, nhưng lượt tải bình thường vẫn nhận bản cũ — đệm cấp zone. Học viên sẽ thấy giao diện cũ tới khi hết hạn đệm. Sửa: Cloudflare → cuongngo.app → Caching → Configuration → Browser Cache TTL → Respect Existing Headers."
          else
            echo "  ✓ tên miền đang phục vụ đúng bản vừa đẩy"
          fi

          echo "--- tiêu đề đệm trên tên miền thật ---"
          # Bước này chạy dưới `bash -e`: grep KHÔNG khớp trả mã 1 và giết cả
          # bước, biến một phép đo chẩn đoán thành deploy đỏ. Phải `|| true`.
          for t in "/" "/app.js" "/app.css" "/sw.js"; do
            hd=$(curl -sI "https://k3vaceo.cuongngo.app$t" | tr -d '\r' || true)
            cc=$(printf '%s\n' "$hd" | grep -i '^cache-control:' | cut -d' ' -f2- || true)
            et=$(printf '%s\n' "$hd" | grep -ci '^etag:' || true)
            echo "  $t → cache-control: ${cc:-(không đặt)} · số dòng etag: ${et:-0}"
            # app.js/app.css/sw.js không có ?v=, nên chúng bị đệm là deploy
            # xong người ta vẫn chạy mã cũ. CẢNH BÁO chứ không đánh hỏng job:
            # `public/_headers` đã đặt no-cache rồi mà tên miền vẫn trả
            # max-age=14400 — tức có một lớp ghi đè ở cấp zone (Caching →
            # Configuration → Browser Cache TTL), sửa bằng bảng điều khiển chứ
            # không sửa được trong repo. Đánh đỏ mọi lượt deploy vì một nút bấm
            # ngoài tầm với chỉ dạy người ta bỏ qua màu đỏ.
            case "$t" in
              /app.js|/app.css|/sw.js)
                case "$cc" in
                  *no-cache*|*no-store*|*max-age=0*) echo "      ✓ luôn hỏi lại máy chủ" ;;
                  *) echo "::warning::$t vẫn bị đệm ($cc) dù _headers đã đặt no-cache. Vào Cloudflare → zone cuongngo.app → Caching → Configuration → Browser Cache TTL, đổi sang 'Respect Existing Headers'. Trong lúc chờ, băng 'Có bản mới' vẫn chạy được vì giao diện tự nạp lại app.js bằng fetch(cache:'reload')." ;;
                esac ;;
            esac
          done

          # Sổ tay là trang tĩnh nằm cạnh ứng dụng. Ba thứ có thể hỏng lặng lẽ
          # mà deploy vẫn xanh: luật vét /* nuốt mất /sotay, CSP chặn tệp JS
          # tách rời (mục lục chết không báo gì), và ảnh thiếu.
          echo "--- sổ tay hướng dẫn tại /sotay ---"
          st=$(curl -sL -o /tmp/sotay.html -w '%{http_code}' https://k3vaceo.cuongngo.app/sotay)
          echo "  HTTP $st ($(wc -c < /tmp/sotay.html) byte)"
          loi=0
          if grep -q '<title>Sổ tay k3vaceo</title>' /tmp/sotay.html; then
            echo "  ✓ ra đúng sổ tay"
          else
            echo "  ✗ /sotay không ra sổ tay"; loi=1
          fi
          if grep -q 'app\.js' /tmp/sotay.html; then
            echo "  ✗ /sotay bị luật vét /* nuốt — trả về giao diện ứng dụng"; loi=1
          else
            echo "  ✓ không bị luật vét /* nuốt"
          fi
          for t in sotay.css sotay.js anh/07-quy-nut-toi-da-chuyen.jpg; do
            m=$(curl -s -o /dev/null -w '%{http_code}' "https://k3vaceo.cuongngo.app/sotay/$t")
            if [ "$m" = "200" ]; then echo "  ✓ /sotay/$t"; else echo "  ✗ /sotay/$t = HTTP $m"; loi=1; fi
          done
          if curl -sI https://k3vaceo.cuongngo.app/sotay/ | grep -qi 'x-robots-tag: *noindex'; then
            echo "  ✓ có X-Robots-Tag: noindex"
          else
            echo "  ✗ thiếu X-Robots-Tag: noindex"; loi=1
          fi
          [ "$loi" = "0" ] || { echo "::error::Sổ tay ở /sotay chưa chạy đúng trên tên miền."; exit 1; }

          echo "--- lịch công khai tại /lich (KHÔNG đăng nhập) ---"
          loi=0
          st=$(curl -sL -o /tmp/lich.html -w '%{http_code}' https://k3vaceo.cuongngo.app/lich || true)
          echo "  HTTP $st ($(cat /tmp/lich.html 2>/dev/null | wc -c) byte)"
          [ "$st" = "200" ] || { echo "  ✗ /lich không mở được (mã $st)"; loi=1; }
          if grep -q 'Lịch học — Lớp CEO K03' /tmp/lich.html; then
            echo "  ✓ ra đúng trang lịch"
          else
            echo "  ✗ /lich không ra trang lịch"; loi=1
          fi
          if grep -q 'src="/app\.js"' /tmp/lich.html; then
            echo "  ✗ /lich bị luật vét /* nuốt — trả về giao diện ứng dụng"; loi=1
          else
            echo "  ✓ không bị luật vét /* nuốt"
          fi
          for t in lich.css lich.js; do
            m=$(curl -s -o /dev/null -w '%{http_code}' "https://k3vaceo.cuongngo.app/lich/$t" || true)
            if [ "$m" = "200" ]; then echo "  ✓ /lich/$t"; else echo "  ✗ /lich/$t = HTTP $m"; loi=1; fi
          done
          if curl -sI https://k3vaceo.cuongngo.app/lich/ | grep -qi 'x-robots-tag: *noindex'; then
            echo "  ✓ có X-Robots-Tag: noindex"
          else
            echo "  ✗ thiếu X-Robots-Tag: noindex"; loi=1
          fi

          echo "--- /api/lich/cong-khai: mở được mà không rò gì thêm ---"
          ck=$(curl -s -o /tmp/ck.json -w '%{http_code}' https://k3vaceo.cuongngo.app/api/lich/cong-khai || true)
          echo "  HTTP $ck ($(cat /tmp/ck.json 2>/dev/null | wc -c) byte)"
          [ "$ck" = "200" ] || { echo "  ✗ đường công khai không mở được"; loi=1; }
          # N6: đường này ai cũng gọi được, nên nó TUYỆT ĐỐI không được mang theo
          # thông báo (có loại nội bộ của nhóm), tên người, hay số tài khoản.
          for cam in thong_bao full_name account_no phone email; do
            if grep -q "$cam" /tmp/ck.json; then
              echo "  ✗ RÒ: đường công khai có chứa \"$cam\""; loi=1
            fi
          done
          if [ "$loi" = "0" ]; then echo "  ✓ chỉ có lịch, không rò gì thêm"; fi
          # In số tư liệu từng buổi. Sandbox không gọi được vào tên miền, nên
          # đây là con mắt duy nhất thấy được tư liệu đã gắn vào buổi hay chưa.
          node --input-type=commonjs -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/ck.json", "utf8"));
            for (const b of d.buoi || []) {
              if (b.so_tu_lieu > 0) console.log(`    ${b.ngay}: ${b.so_tu_lieu} tài liệu — ${b.chu_de.slice(0, 44)}`);
            }
            const t = (d.buoi || []).reduce((s, b) => s + (b.so_tu_lieu || 0), 0);
            console.log(`  tổng ${t} tài liệu đã gắn vào buổi (chỉ đếm tư liệu của lớp)`);
          ' || true

          echo "--- tệp lịch .ics ---"
          ich=$(curl -s -o /tmp/l.ics -D /tmp/l.hdr -w '%{http_code}' https://k3vaceo.cuongngo.app/api/lich/k3vaceo.ics || true)
          echo "  HTTP $ich ($(cat /tmp/l.ics 2>/dev/null | wc -c) byte)"
          [ "$ich" = "200" ] || { echo "  ✗ tệp .ics không tải được (mã $ich)"; loi=1; exit 1; }
          if grep -qi 'content-type: *text/calendar' /tmp/l.hdr; then
            echo "  ✓ Content-Type: text/calendar"
          else
            echo "  ✗ sai Content-Type"; loi=1
          fi
          node --input-type=commonjs -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/l.ics");
            const t = raw.toString("utf8");
            let x = 0;
            const ok = (m, d) => { console.log((d ? "  ✓ " : "  ✗ ") + m); if (!d) x++; };
            ok("mở BEGIN:VCALENDAR và đóng END:VCALENDAR",
               t.startsWith("BEGIN:VCALENDAR") && t.trimEnd().endsWith("END:VCALENDAR"));
            // Ba chỗ dưới đây sai thì ứng dụng lịch từ chối mở mà không nói vì sao
            const nLF = (t.match(/\n/g) || []).length, nCRLF = (t.match(/\r\n/g) || []).length;
            ok(`xuống dòng là CRLF (${nCRLF}/${nLF})`, nLF > 0 && nLF === nCRLF);
            const dai = raw.toString("binary").split("\r\n").filter(d => Buffer.byteLength(d, "binary") > 75);
            ok(`mọi dòng ≤ 75 octet (${dai.length} dòng quá)`, dai.length === 0);
            ok("không có ký tự thay thế (gấp dòng không cắt giữa chữ có dấu)", !t.includes("\uFFFD"));
            const sk = (t.match(/BEGIN:VEVENT/g) || []).length;
            ok(`có ${sk} sự kiện`, sk > 0);
            if (x) { console.error(`::error::Tệp .ics sai khuôn ở ${x} chỗ.`); process.exit(1); }
          '
          [ "$loi" = "0" ] || { echo "::error::Lịch công khai ở /lich chưa chạy đúng trên tên miền."; exit 1; }

          echo "--- giới hạn tần suất: cả lớp chung một WiFi có vào được không ---"
          # Sandbox không gọi được vào tên miền, nên đây là chỗ DUY NHẤT kiểm
          # được rằng bản đang chạy thật có hạn mức mới. Hai đường dưới đây
          # trước 27/8 khoá ở 60 và ở 20 lượt mỗi IP mỗi giờ, mà lớp có 134
          # người ngồi chung một hội trường (xem mục "Giới hạn tần suất" trong
          # CLAUDE.md). Máy chạy workflow có địa chỉ IP riêng nên đốt hạn mức ở
          # đây không đụng gì tới học viên.
          for duong in "tìm tên:/api/wizard/roster/search?q=nguyen:GET:80" \
                       "passkey:/api/passkey/login/options:POST:25"; do
            ten=${duong%%:*}; con=${duong#*:}
            dan=${con%%:*}; con=${con#*:}
            pt=${con%%:*}; lan=${con##*:}
            khoa_o=0
            for i in $(seq 1 "$lan"); do
              if [ "$pt" = "POST" ]; then
                m=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                    -H 'content-type: application/json' -d '{}' \
                    "https://k3vaceo.cuongngo.app$dan" || true)
              else
                m=$(curl -s -o /dev/null -w '%{http_code}' "https://k3vaceo.cuongngo.app$dan" || true)
              fi
              if [ "$m" = "429" ]; then khoa_o=$i; break; fi
            done
            if [ "$khoa_o" != "0" ]; then
              echo "  ✗ $ten: KHOÁ OAN ở lượt thứ $khoa_o trên $lan (bản cũ khoá, bản mới thì không)"
              loi=1
            else
              echo "  ✓ $ten: $lan lượt liên tiếp từ một địa chỉ IP, không lượt nào bị khoá"
            fi
          done
          [ "$loi" = "0" ] || { echo "::error::Giới hạn tần suất vẫn khoá oan — cả lớp ngồi chung WiFi sẽ không vào được."; exit 1; }
          echo "--- /giao-thuong: đường DUY NHẤT đưa dữ liệu người dùng ra internet ---"
          gt=0
          for t in "" gt.js gt.css; do
            m=$(curl -s -o /dev/null -w '%{http_code}' "https://k3vaceo.cuongngo.app/giao-thuong/$t" || true)
            if [ "$m" = "200" ]; then echo "  ✓ /giao-thuong/$t"; else echo "  ✗ /giao-thuong/$t = HTTP $m"; gt=1; fi
          done
          # Ngược hẳn /lich và /sotay: trang này PHẢI cho máy tìm kiếm vào, vì cả
          # lý do nó tồn tại là để người lạ tìm thấy học viên. Kiểm ngược ở đây để
          # ai đó thêm noindex "cho nhất quán" thì workflow kêu lên ngay.
          if curl -sI https://k3vaceo.cuongngo.app/giao-thuong/ | grep -qi 'x-robots-tag: *noindex'; then
            echo "  ✗ CÓ noindex — trang giao thương cố ý phải cho Google index"; gt=1
          else
            echo "  ✓ không có noindex (đúng chủ ý)"
          fi

          ckg=$(curl -s -o /tmp/gt.json -w '%{http_code}' https://k3vaceo.cuongngo.app/api/giao-thuong/cong-khai || true)
          echo "  HTTP $ckg ($(cat /tmp/gt.json 2>/dev/null | wc -c) byte)"
          [ "$ckg" = "200" ] || { echo "  ✗ đường công khai không mở được"; gt=1; }
          # Đường trong lớp phải VẪN đòi đăng nhập. Bỏ N6 là bỏ ranh giới giữa các
          # NHÓM, không phải bỏ ranh giới giữa lớp và người ngoài.
          mi=$(curl -s -o /dev/null -w '%{http_code}' https://k3vaceo.cuongngo.app/api/giao-thuong || true)
          if [ "$mi" = "401" ]; then echo "  ✓ /api/giao-thuong vẫn đòi đăng nhập"; else
            echo "  ✗ /api/giao-thuong trả $mi cho người chưa đăng nhập"; gt=1; fi

          node --input-type=commonjs -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/gt.json", "utf8"));
            const ng = d.nguoi || [];
            let x = 0;
            const ok = (m, c) => { console.log((c ? "  ✓ " : "  ✗ ") + m); if (!c) x++; };
            // Trường nào lọt ra đây là lọt vĩnh viễn — Google đã lấy về thì gỡ
            // khỏi D1 không gỡ được khỏi kết quả tìm kiếm.
            const raw = JSON.stringify(d);
            ok("không lộ nhóm (group_no/group_id)", !/group_no|group_id/.test(raw));
            ok("không lộ cờ nội bộ (cong_khai/is_active/hien_lien_he)",
               !/cong_khai|is_active|hien_lien_he/.test(raw));
            // Ai tắt kèm liên hệ thì phone và email phải là null, không phải thiếu
            // khoá — thiếu khoá nghĩa là mã đã đổi và phép kiểm này hết răng.
            const roLienHe = ng.filter(p => p.phone === undefined || p.email === undefined);
            ok("mọi hồ sơ đều khai báo phone/email (null nếu tắt)", roLienHe.length === 0);
            const coSo = ng.filter(p => p.phone).length;
            console.log(`  ${ng.length} gian hàng công khai, ${coSo} trong đó có kèm số điện thoại`);
            if (ng.length === 0) console.log("  (chưa ai bật — trang hiện lời mời, không phải lỗi)");
            if (x) { console.error(`::error::Đường giao thương công khai rò ${x} chỗ.`); process.exit(1); }
          ' || gt=1
          [ "$gt" = "0" ] || { echo "::error::Giao thương chưa chạy đúng trên tên miền."; exit 1; }

          KHOP="$khop" node --input-type=commonjs -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/health.json", "utf8"));
            // Ghi cứng sĩ số Nhóm 6 là sai bản chất: nhóm ĐƯỢC PHÉP đông thêm.
            // Ngày 24/8 Ban tổ chức chuyển Nguyễn Thị Tùng Vân sang, nhóm lên 15
            // người, và deploy đỏ ba lượt liền trong khi mã lên hoàn toàn bình
            // thường. Một phép kiểm báo động vì chuyện đúng thì tệ hơn không có:
            // lần sau người ta thấy đỏ sẽ bỏ qua. Kiểm "không hụt đi" thay vì
            // "đúng bằng" — hụt mới là dấu hiệu dữ liệu bị mất.
            //
            // Cùng lý do, roster_total nay cũng kiểm "không hụt đi": migration
            // 0023 (4/9) thêm Trương Thị Ngọc Anh — người thứ 135 — nên 134 không
            // còn là số cố định nữa. Ghi cứng lại sẽ đỏ đúng kiểu group6 đã vấp.
            const mong = { ok: true, groups_total: 10,
                           group6_truong_nhom: "Ngô Phú Cường" };
            const TOI_THIEU_NHOM6 = 14;
            const TOI_THIEU_ROSTER = 134;
            let sai = 0;
            {
              const n = d.group6_members;
              const ok = Number.isInteger(n) && n >= TOI_THIEU_NHOM6;
              if (!ok) sai++;
              console.log(`${ok ? "✓" : "✗"} group6_members: ${JSON.stringify(n)} (cần ít nhất ${TOI_THIEU_NHOM6})`);
            }
            {
              const n = d.roster_total;
              const ok = Number.isInteger(n) && n >= TOI_THIEU_ROSTER;
              if (!ok) sai++;
              console.log(`${ok ? "✓" : "✗"} roster_total: ${JSON.stringify(n)} (cần ít nhất ${TOI_THIEU_ROSTER})`);
            }
            for (const [k, v] of Object.entries(mong)) {
              const ok = d[k] === v;
              if (!ok) sai++;
              console.log(`${ok ? "✓" : "✗"} ${k}: ${JSON.stringify(d[k])} (mong đợi ${JSON.stringify(v)})`);
            }
            if (sai) { console.error(`::error::${sai} chỗ lệch ở /api/health.`); process.exit(1); }
            console.log(`\n  bản đang chạy: ${String(d.version || "(chưa ghi)").slice(0, 8)} · đường gửi thư: ${d.mailer || "?"}`);
            console.log(process.env.KHOP === "1"
              ? "\n✓ /api/health đúng hết, và đúng bản vừa deploy. Ứng dụng đã chạy thật trên tên miền."
              : "\n✓ /api/health đúng hết — nhưng đo trên BẢN CŨ, xem cảnh báo phía trên.");
          '

      # Route đang chạy được (đã tạo sẵn trên dashboard), nhưng wrangler không
      # đọc/ghi lại được nó vì thiếu quyền zone. Mã Worker vẫn deploy bình
      # thường; chỉ là mỗi lượt deploy đều đỏ ở bước này. Cảnh báo chứ không
      # đánh hỏng job, vì phần kiểm tra phía trên mới là thước đo thật.
      - name: Nhắc về quyền quản route
        if: steps.check.outputs.skip != 'true' && steps.worker.outputs.route_loi == 'true'
        run: |
          echo "::warning::wrangler không quản được Worker Route vì API token thiếu 'Zone → Workers Routes → Edit' (phạm vi cuongngo.app). Route hiện có vẫn chạy, mã Worker vẫn deploy được — nhưng sửa pattern route trong wrangler.toml sẽ không có tác dụng cho tới khi thêm quyền này."
