name: Deploy lên Cloudflare

# Đẩy code lên nhánh chính là tự deploy. Bấm tay được ở tab Actions khi cần
# deploy lại mà không có thay đổi nào.
on:
  push:
    branches: [claude/read-content-deployment-plan-dpsv8m]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Kiểm tra đã có đủ bí mật chưa
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "Thiếu secret $v — xem README mục 'Deploy tự động từ GitHub'"; exit 1; fi
          done
          if [ -z "${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}" ]; then
            echo "Thiếu secret CLOUDFLARE_D1_DATABASE_ID"; exit 1
          fi

      # database_id không phải bí mật thật (muốn dùng vẫn phải có API token),
      # nhưng để trong secret thì mọi cấu hình nằm chung một chỗ, khỏi phải sửa
      # code mỗi lần đổi cơ sở dữ liệu.
      - name: Điền database_id vào wrangler.toml
        run: sed -i "s/REPLACE_WITH_REAL_DATABASE_ID/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" worker/wrangler.toml

      # Migration ở đây đều là thêm bảng/thêm cột/nạp dữ liệu gốc, và D1 tự ghi
      # nhớ cái nào đã chạy nên không áp lại lần hai.
      - name: Áp migration lên D1 thật
        working-directory: worker
        run: npx wrangler d1 migrations apply k3vaceo --remote

      - name: Deploy Worker (API)
        working-directory: worker
        run: npx wrangler deploy

      # Bí mật SMTP là tuỳ chọn: chưa đặt thì bỏ qua, ứng dụng vẫn chạy, chỉ
      # riêng đăng nhập lại bằng email báo chưa cấu hình.
      - name: Đồng bộ bí mật SMTP cho Worker
        working-directory: worker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -z "$SMTP_HOST" ]; then
            echo "Chưa đặt bí mật SMTP — bỏ qua. Đăng nhập bằng email sẽ báo chưa cấu hình."
            exit 0
          fi
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS MAIL_FROM; do
            printf '%s' "${!name}" | npx wrangler secret put "$name"
          done

      - name: Tạo project Pages nếu chưa có
        run: |
          npx wrangler pages project create k3vaceo \
            --production-branch=claude/read-content-deployment-plan-dpsv8m 2>/dev/null \
            || echo "Project đã tồn tại, bỏ qua."

      - name: Deploy Pages (giao diện)
        run: npx wrangler pages deploy public --project-name=k3vaceo --commit-dirty=true

      - name: Kiểm tra sau khi deploy
        run: |
          echo "Chờ Cloudflare lan cấu hình…"
          sleep 20
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' https://k3vaceo.cuongngo.app/api/health || true)
          echo "HTTP $code"; cat /tmp/health.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning::/api/health chưa trả 200. Kiểm tra domain đã trỏ vào Cloudflare và Worker Route đã có chưa."
          fi
