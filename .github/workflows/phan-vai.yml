name: Phân vai (Ban cán sự lớp và trưởng/phó nhóm)

# Sửa scripts/data/phan-vai.csv rồi commit là chạy. Không cần terminal — sửa
# thẳng bằng trình soạn thảo web của GitHub cũng được.
#
# Đường BÌNH THƯỜNG để một nhóm có trưởng nhóm là người đầu tiên của nhóm mở
# /start và dựng không gian nhóm; làm xong họ tự động thành trưởng nhóm rồi tự
# đặt phó nhóm trong ứng dụng. Workflow này là đường vòng cho lúc đường ấy
# không đi được — chưa ai dựng, hoặc dựng nhầm người.
on:
  push:
    paths: ['scripts/data/phan-vai.csv']
  workflow_dispatch:

concurrency:
  group: phan-vai
  cancel-in-progress: false

jobs:
  nap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx wrangler d1 execute k3vaceo --remote --yes --config worker/wrangler.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Kiểm TRƯỚC khi chạm vào D1: vai lạ, số thứ tự ngoài 1–135 (sĩ số roster
      # hiện tại, xem SEQ_TOI_DA trong build-phan-vai-sql.mjs), hoặc một vai
      # gán cho hai người thì dừng ngay.
      - name: Kiểm tệp CSV
        run: node scripts/build-phan-vai-sql.mjs

      - name: Sinh SQL
        run: node scripts/build-phan-vai-sql.mjs --ra /tmp/vai.sql

      # Nạp bằng --file (đường import của D1 tự cắt lô), rồi đọc kết quả bằng
      # --command ở bước sau: --file KHÔNG trả về dòng nào của SELECT.
      - name: Nạp lên D1 thật
        run: $WRANGLER --file=/tmp/vai.sql

      # Đọc lại từ D1 chứ không tin bước ghi. Tên trong CSV lệch tên trong danh
      # sách gốc thì không câu nào chạm được dòng nào, và chỗ này sẽ bắt được.
      - name: Đọc lại xem ai đang giữ vai gì
        run: |
          SQL="SELECT o.role AS vai, m.full_name AS nguoi,
                      COALESCE(gv.label, '(cấp lớp)') AS pham_vi,
                      COALESCE(m.email, '(chưa khai email)') AS email,
                      o.effective_from AS tu_ngay
                 FROM officers o
                 JOIN members m ON m.id = o.member_id
                 LEFT JOIN groups gv ON gv.id = o.group_id
                WHERE o.superseded_at IS NULL AND o.member_id IS NOT NULL
                ORDER BY gv.no, o.role;"
          $WRANGLER --json --command "$SQL" > /tmp/kq.json
          node --input-type=commonjs -e '
            const raw = require("fs").readFileSync("/tmp/kq.json", "utf8");
            const d = raw.search(/[\[{]/), c = Math.max(raw.lastIndexOf("]"), raw.lastIndexOf("}"));
            const kq = JSON.parse(raw.slice(d, c + 1));
            const rows = (Array.isArray(kq) ? kq : [kq]).flatMap(x => (x && x.results) || []);
            if (!rows.length) { console.error("✗ Không có vai nào đang hiệu lực — kiểm tra lại toàn bộ."); process.exit(1); }
            for (const r of rows)
              console.log(`${String(r.vai).padEnd(11)} → ${r.nguoi} · ${r.pham_vi} · ${r.email} · từ ${r.tu_ngay}`);

            // So khớp TỪNG DÒNG của CSV với danh sách vai đang hiệu lực — không
            // so TỔNG SỐ, vì phần lớn vai cấp NHÓM (truong_nhom/pho_nhom/
            // tieu_bieu) đến từ đường bình thường (wizard tự gán khi dựng
            // không gian nhóm), không qua tệp này. So tổng số đã khiến bước
            // này đỏ ngay từ lượt chạy đầu tiên (run #1) và mọi lượt sau đó,
            // vì Nhóm 6 luôn có sẵn officer ngoài CSV — đỏ giả không báo đúng
            // chuyện gì, chỉ dạy người ta bỏ qua màu đỏ của chính workflow này.
            const dongCsv = require("fs").readFileSync("scripts/data/phan-vai.csv", "utf8")
              .split("\n").map(l => l.replace(/\r$/, ""))
              .filter(l => l.trim() && !l.trimStart().startsWith("#")).slice(1);
            let thieu = 0;
            for (const dong of dongCsv) {
              // Chỉ cần ba cột đầu (vai, stt, tên) — ghi_chu (cột thứ tư) có
              // thể chứa dấu phẩy/ngoặc kép, nhưng ba cột đầu thì không bao
              // giờ, nên tách bằng dấu phẩy thường vẫn lấy đúng tên.
              const [vai, , ten] = dong.split(",").map(s => s.trim());
              const khop = rows.some(r => r.vai === vai && r.nguoi === ten);
              if (!khop) { console.error(`✗ Chưa thấy "${vai} → ${ten}" trong vai đang hiệu lực.`); thieu++; }
            }
            if (thieu) process.exit(1);
            console.log("\n✓ ĐÚNG HẾT. Ban cán sự lớp đã có quyền tạo đợt thu quỹ lớp và ghi sổ chi quỹ lớp.");
            console.log("  Họ vẫn phải tự đăng nhập ở /dangnhap để nhận hồ sơ trước khi dùng được.");
          '
