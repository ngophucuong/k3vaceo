name: Soi dữ liệu thật (chỉ đọc)

# Không ghi gì, không gửi thư. Chỉ đọc D1 thật để trả lời câu hỏi hay gặp
# nhất: "tôi bấm xin mã mà không thấy thư — hệ thống có gửi không?"
#
# Ba khả năng, và ba dòng dưới đây phân biệt được:
#   · có dòng trong otp_codes  → Worker CÓ sinh mã và có gọi gửi thư
#   · không có dòng nào        → chưa tới bước khai email, hoặc bị khoá tần suất
#   · rate_events dày đặc      → chạm trần, phải chờ hết giờ
on:
  push:
    paths: ['.github/soi-du-lieu.trigger']
  workflow_dispatch:
    inputs:
      email:
        description: 'Email cần soi'
        type: string
        default: 'ngophucuong@gmail.com'

concurrency:
  group: soi-du-lieu
  cancel-in-progress: false

jobs:
  soi:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx wrangler d1 execute k3vaceo --remote --yes --config worker/wrangler.toml
      EMAIL: ${{ inputs.email || 'ngophucuong@gmail.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Phần này KHÔNG hỏi về một người, mà hỏi về CẢ LỚP — thêm 5/9 khi Ngô Phú
      # Cường báo "nhiều học viên không nhận được email OTP". Soi từng địa chỉ
      # một thì không bao giờ trả lời được câu "nhiều" là bao nhiêu, và tệ hơn:
      # người kêu to nhất chưa chắc là người đại diện cho lỗi thật.
      #
      # PHÉP ĐO QUYẾT ĐỊNH là TỈ LỆ MÃ ĐÃ DÙNG. `otp_codes` có dòng chỉ chứng
      # minh Worker đã GỌI gửi thư (createOtp ghi dòng TRƯỚC khi gọi sendMail —
      # xem guiMa() trong routes/onboard.js), không chứng minh thư tới nơi.
      # Nhưng `used_at` khác NULL thì chắc chắn: người đó đã ĐỌC ĐƯỢC mã trong
      # hộp thư và gõ lại đúng. Không có đường nào khác để biết mã ấy.
      #   · tỉ lệ dùng cao  → thư tới bình thường, lỗi nằm ở vài người lẻ
      #   · tỉ lệ dùng thấp → thư KHÔNG tới tay, hỏng ở đường gửi hoặc vào spam
      - name: Soi cả lớp — thư có tới tay không
        run: |
          echo "════ 24 giờ qua: xin mã bao nhiêu lần, dùng được bao nhiêu ════"
          $WRANGLER --command \
            "SELECT COUNT(*) AS ma_da_sinh,
                    COUNT(DISTINCT member_id) AS so_nguoi_xin,
                    SUM(CASE WHEN used_at IS NOT NULL THEN 1 ELSE 0 END) AS da_dung_duoc,
                    SUM(CASE WHEN used_at IS NULL THEN 1 ELSE 0 END) AS khong_dung_duoc
               FROM otp_codes WHERE created_at > datetime('now','-24 hours')" 2>&1 | tail -12

          echo
          echo "════ Chia theo giờ (giờ Việt Nam) ════"
          $WRANGLER --command \
            "SELECT strftime('%d/%m %Hh', created_at, '+7 hours') AS gio_vn,
                    COUNT(*) AS xin_ma,
                    SUM(CASE WHEN used_at IS NOT NULL THEN 1 ELSE 0 END) AS dung_duoc
               FROM otp_codes WHERE created_at > datetime('now','-24 hours')
              GROUP BY gio_vn ORDER BY gio_vn DESC LIMIT 24" 2>&1 | tail -32

          echo
          echo "════ AI ĐANG KẸT: xin mã mà chưa lần nào vào được ════"
          echo "Đây là danh sách cần gọi điện hoặc phát link mời cho họ."
          $WRANGLER --command \
            "SELECT m.full_name AS ho_ten, g.label AS nhom, m.email,
                    COUNT(*) AS so_lan_xin, MAX(o.created_at) AS lan_gan_nhat
               FROM otp_codes o JOIN members m ON m.id = o.member_id
               LEFT JOIN groups g ON g.id = m.group_id
              WHERE o.created_at > datetime('now','-24 hours')
              GROUP BY m.id
             HAVING SUM(CASE WHEN o.used_at IS NOT NULL THEN 1 ELSE 0 END) = 0
              ORDER BY so_lan_xin DESC, lan_gan_nhat DESC LIMIT 30" 2>&1 | tail -45

          echo
          echo "════ Tên miền email — bắt lỗi gõ nhầm khi tự khai ════"
          echo "email_verified_at CỐ Ý để trống (mục 'Bỏ OTP ở lần đầu' trong"
          echo "CLAUDE.md), nên gõ nhầm một chữ là thư bay vào hư không mà"
          echo "không ai báo. gmial/gmai/gmail.con là nghi phạm quen mặt."
          $WRANGLER --command \
            "SELECT LOWER(substr(email, instr(email,'@')+1)) AS mien,
                    COUNT(*) AS so_nguoi
               FROM members WHERE COALESCE(email,'') <> ''
              GROUP BY mien ORDER BY so_nguoi DESC LIMIT 25" 2>&1 | tail -35

          echo
          echo "════ Trần tần suất của CẢ LỚP trong 1 giờ qua ════"
          echo "otp_email trần 5 mỗi địa chỉ. otp_request trần 150 mỗi IP."
          echo "Cả lớp ngồi chung WiFi hội trường thì đếm theo IP là đếm cả phòng."
          $WRANGLER --command \
            "SELECT bucket AS o_khoa, ip AS khoa_theo, COUNT(*) AS so_lan,
                    MAX(created_at) AS gan_nhat
               FROM rate_events
              WHERE created_at > datetime('now','-1 hour')
                AND bucket IN ('otp_email','otp_request')
              GROUP BY bucket, ip HAVING so_lan >= 4
              ORDER BY so_lan DESC LIMIT 20" 2>&1 | tail -30

      - name: Đọc
        run: |
          em=$(printf '%s' "$EMAIL" | sed "s/'/''/g")

          echo "════ Hồ sơ của $EMAIL ════"
          $WRANGLER --command \
            "SELECT m.id, m.full_name, g.label AS nhom, m.is_active,
                    COALESCE(m.claimed_at,'(chưa nhận chỗ)') AS nhan_cho,
                    COALESCE(m.email_verified_at,'(chưa xác minh email)') AS xac_minh
               FROM members m LEFT JOIN groups g ON g.id = m.group_id
              WHERE m.email = '$em'" 2>&1 | tail -20

          echo
          echo "════ Mã đã sinh trong 3 giờ qua ════"
          echo "Mỗi dòng ở đây = một lần Worker THẬT SỰ gọi gửi thư."
          $WRANGLER --command \
            "SELECT o.created_at AS luc_sinh, o.expires_at AS het_han,
                    o.attempts AS so_lan_nhap_sai,
                    COALESCE(o.used_at,'(chưa dùng)') AS da_dung
               FROM otp_codes o JOIN members m ON m.id = o.member_id
              WHERE m.email = '$em' AND o.created_at > datetime('now','-3 hours')
              ORDER BY o.id DESC LIMIT 10" 2>&1 | tail -25

          echo
          echo "════ Đã chạm trần tần suất chưa (1 giờ gần nhất) ════"
          echo "otp_email theo địa chỉ thư: trần 5. otp_request theo IP: trần 40."
          $WRANGLER --command \
            "SELECT bucket AS o_khoa, ip AS khoa_theo, COUNT(*) AS so_lan,
                    MAX(created_at) AS gan_nhat
               FROM rate_events
              WHERE created_at > datetime('now','-1 hour')
              GROUP BY bucket, ip ORDER BY so_lan DESC LIMIT 15" 2>&1 | tail -25

          echo
          echo "Cách đọc:"
          echo "  · Có dòng trong bảng giữa  → thư ĐÃ được gửi đi, lỗi nằm ở khâu nhận."
          echo "  · Bảng giữa trống          → chưa tới bước khai email, hoặc bị khoá."
          echo "  · otp_email đạt 5          → chạm trần, chờ hết giờ hoặc dùng link mời."
