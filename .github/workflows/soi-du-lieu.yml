name: Soi dữ liệu thật (chỉ đọc)

# Không ghi gì, không gửi thư. Chỉ đọc D1 thật để trả lời câu hỏi hay gặp
# nhất: "tôi bấm xin mã mà không thấy thư — hệ thống có gửi không?"
#
# Ba khả năng, và ba dòng dưới đây phân biệt được:
#   · có dòng trong otp_codes  → Worker CÓ sinh mã và có gọi gửi thư
#   · không có dòng nào        → chưa tới bước khai email, hoặc bị khoá tần suất
#   · rate_events dày đặc      → chạm trần, phải chờ hết giờ
on:
  push:
    paths: ['.github/soi-du-lieu.trigger']
  workflow_dispatch:
    inputs:
      email:
        description: 'Email cần soi'
        type: string
        default: 'ngophucuong@gmail.com'

concurrency:
  group: soi-du-lieu
  cancel-in-progress: false

jobs:
  soi:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx wrangler d1 execute k3vaceo --remote --yes --config worker/wrangler.toml
      EMAIL: ${{ inputs.email || 'ngophucuong@gmail.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Phần này KHÔNG hỏi về một người, mà hỏi về CẢ LỚP — thêm 5/9 khi Ngô Phú
      # Cường báo "nhiều học viên không nhận được email OTP". Soi từng địa chỉ
      # một thì không bao giờ trả lời được câu "nhiều" là bao nhiêu, và tệ hơn:
      # người kêu to nhất chưa chắc là người đại diện cho lỗi thật.
      #
      # PHÉP ĐO QUYẾT ĐỊNH là TỈ LỆ MÃ ĐÃ DÙNG. `otp_codes` có dòng chỉ chứng
      # minh Worker đã GỌI gửi thư (createOtp ghi dòng TRƯỚC khi gọi sendMail —
      # xem guiMa() trong routes/onboard.js), không chứng minh thư tới nơi.
      # Nhưng `used_at` khác NULL thì chắc chắn: người đó đã ĐỌC ĐƯỢC mã trong
      # hộp thư và gõ lại đúng. Không có đường nào khác để biết mã ấy.
      #   · tỉ lệ dùng cao  → thư tới bình thường, lỗi nằm ở vài người lẻ
      #   · tỉ lệ dùng thấp → thư KHÔNG tới tay, hỏng ở đường gửi hoặc vào spam
      - name: Soi cả lớp — thư có tới tay không
        run: |
          # `tail -N` là cách đọc SAI: wrangler in khoảng 25 dòng JSON meta sau
          # mỗi truy vấn, nên tail cắt mất đúng phần kết quả — lượt chạy đầu
          # (5/9) mất trắng bảng tổng quan vì lý do ấy. Lọc bằng jq thay vì đếm
          # dòng: lấy đúng mảng results, in mỗi dòng một bản ghi.
          soi() {
            echo "════ $1 ════"
            npx wrangler d1 execute k3vaceo --remote --yes --json \
              --config worker/wrangler.toml --command "$2" 2>/dev/null \
              | sed -n '/^\[/,$p' \
              | jq -r '.[0].results[] | to_entries | map("\(.key)=\(.value)") | join("  ·  ")' \
              || echo "  (không đọc được kết quả)"
            echo
          }

          # CÂU HỎI GỐC: "nhiều học viên không nhận được mã". Nhưng có một nhánh
          # KHÔNG để lại dấu vết nào trong otp_codes — postOtpRequest (routes/
          # onboard.js) trả lời "đã gửi" y hệt cho email KHÔNG có trong members,
          # cố ý, để không lộ ai đã đăng ký. Người gõ nhầm email, hoặc chưa từng
          # nhận hồ sơ, sẽ thấy màn hình báo đã gửi rồi chờ mãi. Vì vậy phải đo
          # cả MẪU SỐ: bao nhiêu người thật sự CÓ thể nhận được thư.
          soi "Mẫu số: bao nhiêu người có thể nhận được thư" \
            "SELECT (SELECT COUNT(*) FROM roster) AS trong_danh_sach_goc,
                    COUNT(*) AS co_ho_so_members,
                    SUM(CASE WHEN claimed_at IS NOT NULL THEN 1 ELSE 0 END) AS da_nhan_ho_so,
                    SUM(CASE WHEN COALESCE(email,'') <> '' THEN 1 ELSE 0 END) AS co_email,
                    SUM(CASE WHEN email_verified_at IS NOT NULL THEN 1 ELSE 0 END) AS da_xac_minh_email
               FROM members WHERE is_active = 1"

          soi "7 ngày qua: xin mã bao nhiêu lần, dùng được bao nhiêu" \
            "SELECT COUNT(*) AS ma_da_sinh,
                    COUNT(DISTINCT member_id) AS so_nguoi_xin,
                    SUM(CASE WHEN used_at IS NOT NULL THEN 1 ELSE 0 END) AS da_dung_duoc,
                    SUM(CASE WHEN used_at IS NULL THEN 1 ELSE 0 END) AS khong_dung_duoc
               FROM otp_codes WHERE created_at > datetime('now','-7 days')"

          soi "Chia theo ngày (giờ Việt Nam)" \
            "SELECT date(created_at, '+7 hours') AS ngay_vn,
                    COUNT(*) AS xin_ma,
                    SUM(CASE WHEN used_at IS NOT NULL THEN 1 ELSE 0 END) AS dung_duoc
               FROM otp_codes WHERE created_at > datetime('now','-7 days')
              GROUP BY ngay_vn ORDER BY ngay_vn DESC"

          soi "AI ĐANG KẸT: xin mã mà chưa lần nào vào được (7 ngày)" \
            "SELECT m.full_name AS ho_ten, g.label AS nhom, m.email,
                    COUNT(*) AS so_lan_xin, MAX(o.created_at) AS lan_gan_nhat
               FROM otp_codes o JOIN members m ON m.id = o.member_id
               LEFT JOIN groups g ON g.id = m.group_id
              WHERE o.created_at > datetime('now','-7 days')
              GROUP BY m.id
             HAVING SUM(CASE WHEN o.used_at IS NOT NULL THEN 1 ELSE 0 END) = 0
              ORDER BY so_lan_xin DESC, lan_gan_nhat DESC LIMIT 30"

          # Đây mới là nhóm ĐÔNG NHẤT của triệu chứng "không nhận được thư":
          # họ chưa từng nhận hồ sơ nên trong members chưa có email nào, gõ gì
          # vào /dangnhap cũng rơi vào nhánh im lặng.
          soi "Người CHƯA nhận hồ sơ — gõ email vào /dangnhap là im lặng" \
            "SELECT COUNT(*) AS so_nguoi_chua_the_dang_nhap
               FROM roster r
              WHERE NOT EXISTS (SELECT 1 FROM members m
                                 WHERE m.roster_id = r.id AND m.claimed_at IS NOT NULL)"

          # Thông báo đẩy: "có gửi" và "có tới" là hai chuyện khác nhau.
          # guiThongBaoDay() chỉ gửi cho ai CÓ DÒNG trong push_subscriptions —
          # không ai bật thì nó lặng lẽ trả {gui: 0}, không lỗi, không dấu vết.
          # last_ok_at là bằng chứng DUY NHẤT máy chủ đẩy đã nhận gói tin.
          soi "Thông báo đẩy: bao nhiêu người đã bật, và có gửi được không" \
            "SELECT COUNT(*) AS so_dang_ky,
                    SUM(CASE WHEN disabled_at IS NULL THEN 1 ELSE 0 END) AS con_hieu_luc,
                    SUM(CASE WHEN last_ok_at IS NOT NULL THEN 1 ELSE 0 END) AS da_tung_gui_ok,
                    MAX(last_ok_at) AS lan_gui_ok_gan_nhat,
                    MAX(last_error) AS loi_gan_nhat
               FROM push_subscriptions"

          soi "Tên miền email — bắt lỗi gõ nhầm khi tự khai" \
            "SELECT LOWER(substr(email, instr(email,'@')+1)) AS mien,
                    COUNT(*) AS so_nguoi
               FROM members WHERE COALESCE(email,'') <> ''
              GROUP BY mien ORDER BY so_nguoi DESC"

          soi "Trần tần suất của CẢ LỚP trong 3 giờ qua (trần 5/email, 150/IP)" \
            "SELECT bucket AS o_khoa, ip AS khoa_theo, COUNT(*) AS so_lan,
                    MAX(created_at) AS gan_nhat
               FROM rate_events
              WHERE created_at > datetime('now','-3 hours')
                AND bucket IN ('otp_email','otp_request','otp_verify')
              GROUP BY bucket, ip ORDER BY so_lan DESC LIMIT 20"
          # Toàn vẹn số điện thoại. `roster.phone` là bí mật DUY NHẤT mở cửa
          # /vao cho một hồ sơ chưa ai nhận (soHopLeTuHoSo, routes/onboard.js),
          # nên hai người chung một số nghĩa là hai cánh cửa mở bằng cùng một
          # chìa. Migration 0033 vừa gỡ một ca như thế (0914544449, hai người
          # tên Tiến) — phép đo này xác nhận trên D1 THẬT, và bắt được ca mới
          # nếu về sau có ai điền trùng.
          # GLOB '0[0-9]*' CHỈ soi hai ký tự đầu — `03845375x8` (số của Đặng
          # Hùng, lẫn chữ "x") lọt qua sạch vì nó dài đúng 10 và bắt đầu bằng
          # "0" rồi "3". Phải soi TOÀN chuỗi bằng GLOB '*[^0-9]*'. Đo được:
          # cách cũ đếm 3, cách đúng đếm 4. Cùng lỗi ấy có ở
          # bo-sung-dien-thoai.yml, đã sửa kèm.
          soi "Toàn vẹn số điện thoại của roster" \
            "SELECT (SELECT COUNT(*) FROM roster WHERE phone IS NULL) AS chua_co_so,
                    (SELECT COUNT(*) FROM roster WHERE phone IS NOT NULL
                       AND (LENGTH(phone) <> 10 OR phone NOT GLOB '0*' OR phone GLOB '*[^0-9]*')) AS sai_khuon,
                    (SELECT COUNT(*) FROM (SELECT phone FROM roster
                       WHERE phone IS NOT NULL GROUP BY phone HAVING COUNT(*) > 1))
                      AS so_bi_dung_chung"

          # Ai còn dùng chung số với ai — cần TÊN chứ không chỉ con số, vì mỗi
          # ca phải phân định riêng bằng bằng chứng ngoài đời.
          soi "Cụ thể những ai đang chung số" \
            "SELECT phone AS so, COUNT(*) AS so_nguoi,
                    GROUP_CONCAT(full_name, ' | ') AS nhung_ai
               FROM roster WHERE phone IS NOT NULL
              GROUP BY phone HAVING COUNT(*) > 1"

          # Hai người tên Tiến sau migration 0033: số phải nằm ở ĐÚNG MỘT hồ sơ.
          soi "Hai người tên Tiến (kiểm migration 0033)" \
            "SELECT seq, full_name, COALESCE(phone,'(trống)') AS so, group_label
               FROM roster WHERE seq IN (65, 102) ORDER BY seq"


      - name: Đọc
        run: |
          em=$(printf '%s' "$EMAIL" | sed "s/'/''/g")

          echo "════ Hồ sơ của $EMAIL ════"
          $WRANGLER --command \
            "SELECT m.id, m.full_name, g.label AS nhom, m.is_active,
                    COALESCE(m.claimed_at,'(chưa nhận chỗ)') AS nhan_cho,
                    COALESCE(m.email_verified_at,'(chưa xác minh email)') AS xac_minh
               FROM members m LEFT JOIN groups g ON g.id = m.group_id
              WHERE m.email = '$em'" 2>&1 | tail -20

          echo
          echo "════ Mã đã sinh trong 3 giờ qua ════"
          echo "Mỗi dòng ở đây = một lần Worker THẬT SỰ gọi gửi thư."
          $WRANGLER --command \
            "SELECT o.created_at AS luc_sinh, o.expires_at AS het_han,
                    o.attempts AS so_lan_nhap_sai,
                    COALESCE(o.used_at,'(chưa dùng)') AS da_dung
               FROM otp_codes o JOIN members m ON m.id = o.member_id
              WHERE m.email = '$em' AND o.created_at > datetime('now','-3 hours')
              ORDER BY o.id DESC LIMIT 10" 2>&1 | tail -25

          echo
          echo "════ Đã chạm trần tần suất chưa (1 giờ gần nhất) ════"
          echo "otp_email theo địa chỉ thư: trần 5. otp_request theo IP: trần 40."
          $WRANGLER --command \
            "SELECT bucket AS o_khoa, ip AS khoa_theo, COUNT(*) AS so_lan,
                    MAX(created_at) AS gan_nhat
               FROM rate_events
              WHERE created_at > datetime('now','-1 hour')
              GROUP BY bucket, ip ORDER BY so_lan DESC LIMIT 15" 2>&1 | tail -25

          echo
          echo "Cách đọc:"
          echo "  · Có dòng trong bảng giữa  → thư ĐÃ được gửi đi, lỗi nằm ở khâu nhận."
          echo "  · Bảng giữa trống          → chưa tới bước khai email, hoặc bị khoá."
          echo "  · otp_email đạt 5          → chạm trần, chờ hết giờ hoặc dùng link mời."
