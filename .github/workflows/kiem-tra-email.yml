name: Đổi email và thử đăng nhập bằng email

# Hai việc trong một lượt: đổi email của một người trong bảng members, rồi thử
# đúng luồng "đăng nhập lại bằng email" trên tên miền thật.
#
# Vì sao phải bắt log Worker: handler gửi thư bằng ctx.waitUntil, tức là TRẢ
# LỜI TRƯỚC rồi mới bắt tay SMTP. HTTP 200 chỉ chứng minh có đủ bí mật SMTP,
# KHÔNG chứng minh thư đi được. Chỗ duy nhất lộ ra sự thật là dòng
# console.error trong Worker — nên vừa gọi vừa mở `wrangler tail`.
on:
  workflow_dispatch:
    inputs:
      ho_ten:
        description: 'Họ tên đúng như trong bảng members'
        type: string
        default: 'Ngô Phú Cường'
      email_moi:
        description: 'Email mới (để trống thì chỉ thử, không đổi)'
        type: string
        default: ''
  push:
    paths: ['.github/kiem-tra-email.trigger']

concurrency:
  group: kiem-tra-email
  cancel-in-progress: false

jobs:
  thu:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx wrangler d1 execute k3vaceo --remote --yes --config worker/wrangler.toml
      HO_TEN: ${{ inputs.ho_ten || 'Ngô Phú Cường' }}
      EMAIL_MOI: ${{ inputs.email_moi || 'ngophucuong@gmail.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Đồng bộ TRƯỚC khi thử, để workflow này tự chủ. Nếu không thì có cái bẫy
      # thứ tự: đặt secret ở GitHub xong chạy thử ngay vẫn hỏng, vì giá trị chỉ
      # sang Worker khi deploy.yml chạy. Bỏ qua tên không đặt — đẩy chuỗi rỗng
      # lên là tạo bí mật rỗng, trông như "đã có" mà không dùng được.
      - name: Đồng bộ bí mật SMTP từ GitHub sang Worker
        working-directory: worker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # KHÔNG để bước này đánh hỏng cả job. Nó chỉ là dây an toàn — deploy.yml
          # đã đồng bộ bí mật ở mỗi lần deploy rồi. Mà nó lại hay hỏng vì tranh
          # chấp: cùng một cú push kích hoạt cả deploy.yml lẫn workflow này, nên
          # `wrangler secret put` chạy trúng lúc deploy đang dở sẽ nhận
          #   "Secret edit failed ... the latest version isn't currently deployed".
          # Hỏng ở đây mà dừng cả job thì mất luôn phép thử gửi thư — thứ duy
          # nhất ta thật sự cần biết.
          da= ; hong=
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE \
                      SMTP_USER SMTP_PASS MAIL_FROM \
                      SMTP_USERNAME SMTP_PASSWORD SMTP_FROM_EMAIL \
                      RESEND_API_KEY; do
            [ -z "${!name}" ] && continue
            for lan in 1 2 3 4; do
              if printf '%s' "${!name}" | npx wrangler secret put "$name" >/dev/null 2>/tmp/loi-secret; then
                da="$da $name"; break
              fi
              if [ "$lan" = "4" ]; then
                hong="$hong $name"
                echo "::warning::Không đặt được $name sau 4 lần — $(tr -d '\n' < /tmp/loi-secret | tail -c 200)"
              else
                sleep $((lan * 10))
              fi
            done
          done
          [ -n "$da" ] && echo "✓ đã đẩy từ GitHub sang Worker:$da"
          [ -n "$hong" ] && echo "· không đẩy được:$hong (dùng giá trị Worker đang có)"
          [ -z "$da$hong" ] && echo "::warning::Không có bí mật SMTP nào trong GitHub — giữ nguyên những gì Worker đang có."
          # `wrangler secret put` tạo một bản triển khai mới; chờ vài giây cho lan.
          sleep 5
          exit 0

      # Bí mật chỉ có tác dụng trên BẢN ĐANG CHẠY. `wrangler secret put` tạo một
      # version mới mỗi lần gọi, và nếu version ấy không được đưa ra chạy thì bí
      # mật nằm ở bản treo còn người dùng vẫn gặp bản cũ. Đối chiếu hai thứ đó.
      - name: Bản đang chạy có phải bản mới nhất không
        working-directory: worker
        run: |
          echo "--- version mới nhất đã tải lên ---"
          npx wrangler versions list 2>&1 | tail -12 || true
          echo
          echo "--- bản đang phục vụ người dùng ---"
          npx wrangler deployments list 2>&1 | tail -12 || true
          exit 0

      - name: Chuẩn bị bộ đọc kết quả
        run: |
          cat > /tmp/doc-so.cjs <<'EOF'
          const raw = require("fs").readFileSync(process.argv[2], "utf8");
          const d = raw.search(/[\[{]/), c = Math.max(raw.lastIndexOf("]"), raw.lastIndexOf("}"));
          if (d < 0 || c < d) { console.error("Không tìm thấy JSON:\n" + raw.slice(0, 1000)); process.exit(1); }
          const kq = JSON.parse(raw.slice(d, c + 1));
          const dong = (Array.isArray(kq) ? kq : [kq]).flatMap(x => (x && x.results) || []);
          process.stdout.write(String(dong.length ? dong[0][process.argv[3]] : ""));
          EOF

      # Bảng members có UNIQUE(cohort_id, email) — đổi trúng email người khác
      # là lỗi ràng buộc, mà tệ hơn: email là lối đăng nhập nên trùng email là
      # trùng luôn lối vào. Kiểm trước cho ra lỗi dễ hiểu.
      - name: Kiểm email mới chưa ai dùng
        run: |
          ten=$(printf '%s' "$HO_TEN" | sed "s/'/''/g")
          em=$(printf '%s' "$EMAIL_MOI" | sed "s/'/''/g")
          $WRANGLER --json --command "SELECT COUNT(*) AS n FROM members
            WHERE email = '$em' AND full_name <> '$ten';" > /tmp/tr.json
          n=$(node /tmp/doc-so.cjs /tmp/tr.json n)
          if [ "$n" != "0" ]; then
            echo "::error::Email $EMAIL_MOI đã thuộc về $n người khác trong lớp."; exit 1
          fi
          echo "✓ email chưa ai dùng"

      - name: Đổi email rồi đọc lại
        run: |
          ten=$(printf '%s' "$HO_TEN" | sed "s/'/''/g")
          em=$(printf '%s' "$EMAIL_MOI" | sed "s/'/''/g")
          $WRANGLER --command "UPDATE members SET email = '$em', updated_at = datetime('now')
            WHERE full_name = '$ten';" >/dev/null
          $WRANGLER --json --command "SELECT email FROM members
            WHERE full_name = '$ten' AND is_active = 1;" > /tmp/em.json
          thuc=$(node /tmp/doc-so.cjs /tmp/em.json email)
          if [ "$thuc" != "$EMAIL_MOI" ]; then
            echo "::error::Đọc lại ra '$thuc' chứ không phải '$EMAIL_MOI'."; exit 1
          fi
          echo "✓ email của $HO_TEN nay là $thuc"

      # `wrangler secret list` chỉ trả về TÊN bí mật, không trả giá trị — nên
      # chạy được ở đây mà không lộ gì. Nhờ vậy khi Worker báo
      # mailer_not_configured thì nói được ngay thiếu đúng cái nào, thay vì bắt
      # người dùng mò cả bốn.
      - name: Liệt kê tên bí mật đang có trên Worker
        run: |
          npx wrangler secret list --config worker/wrangler.toml > /tmp/bm.json 2>/dev/null || true
          node --input-type=commonjs -e '
            const fs = require("fs");
            let ten = [];
            try {
              const raw = fs.readFileSync("/tmp/bm.json", "utf8");
              const d = raw.indexOf("["), c = raw.lastIndexOf("]");
              if (d >= 0 && c > d) ten = JSON.parse(raw.slice(d, c + 1)).map(x => x.name);
            } catch (e) { console.log("(không đọc được danh sách bí mật:", String(e) + ")"); }
            // Mỗi thứ chấp nhận nhiều tên — mailer.js đọc được cả hai bộ.
            const can = [["SMTP_HOST"], ["SMTP_USER", "SMTP_USERNAME"],
                         ["SMTP_PASS", "SMTP_PASSWORD"], ["MAIL_FROM", "SMTP_FROM_EMAIL"]];
            const tuychon = [["SMTP_PORT"], ["SMTP_SECURE"]];
            console.log("Bí mật đang có:", ten.length ? ten.join(", ") : "(không thấy cái nào)");
            const co = bo => bo.find(x => ten.includes(x));
            for (const bo of can) {
              const c = co(bo);
              console.log(`${c ? "✓ " + c : "✗ " + bo.join(" hoặc ")}  (bắt buộc)`);
            }
            for (const bo of tuychon) {
              const c = co(bo);
              console.log(`${c ? "✓ " + c : "· " + bo[0]}  (tuỳ chọn — cổng mặc định 587, và cổng 465 tự hiểu là TLS)`);
            }
            const thieu = can.filter(bo => !co(bo)).map(bo => bo.join(" hoặc "));
            fs.writeFileSync("/tmp/thieu", thieu.join("; "));
            if (thieu.length) console.log(`\n→ THIẾU: ${thieu.join("; ")}`);
          '

      # PHÉP THỬ ĐỐI CHỨNG. Worker báo Hostinger đã nhận thư (mã 250) mà hộp
      # thư vẫn trống. Hai khả năng còn lại rất khác nhau, và chỉ phép này tách
      # được chúng:
      #   a) Worker gửi ra thứ gì đó Hostinger nhận rồi vứt → gửi từ runner sẽ
      #      TỚI NƠI, và ta so hai lá thư để tìm chỗ khác nhau.
      #   b) Bản thân Hostinger không chuyển được thư tới Gmail → gửi từ runner
      #      cũng KHÔNG tới, và mọi việc phải làm nằm ở phía nhà cung cấp.
      # Runner dùng thư viện tls chuẩn của Node, không dính gì tới Cloudflare.
      - name: Đối chứng — gửi thẳng từ runner tới Hostinger
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat > /tmp/gui-thang.cjs <<'EOF'
          const tls = require("tls");
          const host = process.env.SMTP_HOST || "smtp.hostinger.com";
          const port = Number(process.env.SMTP_PORT || 465);
          const user = process.env.SMTP_USER || process.env.SMTP_USERNAME;
          const pass = process.env.SMTP_PASS || process.env.SMTP_PASSWORD;
          const from = process.env.MAIL_FROM || process.env.SMTP_FROM_EMAIL;
          const to   = process.env.EMAIL_MOI;
          if (!user || !pass || !from) { console.log("(thiếu bí mật, bỏ qua phép đối chứng)"); process.exit(0); }
          const dcGui = (String(from).match(/<([^>]+)>/) || [null, String(from).trim()])[1];

          // Che mật khẩu và tài khoản khi in đối thoại ra log công khai.
          const che = t => String(t)
            .split(Buffer.from(pass).toString("base64")).join("<mật khẩu>")
            .split(Buffer.from(user).toString("base64")).join("<tài khoản>");

          const s = tls.connect({ host, port, servername: host });
          let dem = "", cho = null;
          const doi = () => new Promise(r => { cho = r; });
          s.on("data", d => {
            dem += d.toString();
            const dong = dem.split("\r\n").filter(Boolean);
            const cuoi = dong[dong.length - 1];
            if (cuoi && /^\d{3} /.test(cuoi)) { const t = dem; dem = ""; const f = cho; cho = null; f && f(t); }
          });
          const noi = async (lenh, nhan) => {
            if (lenh !== null) { console.log("→ " + che(nhan || lenh).split("\r\n")[0]); s.write(lenh + "\r\n"); }
            const tra = await doi();
            console.log("← " + che(tra).trim().split("\n").map(x => x.trim()).join(" | "));
            return tra;
          };

          (async () => {
            await noi(null);
            await noi("EHLO runner.github");
            await noi("AUTH LOGIN");
            await noi(Buffer.from(user).toString("base64"), "<tài khoản>");
            await noi(Buffer.from(pass).toString("base64"), "<mật khẩu>");
            await noi(`MAIL FROM:<${dcGui}>`);
            await noi(`RCPT TO:<${to}>`);
            await noi("DATA");
            const uuid = require("crypto").randomUUID();
            const mien = dcGui.split("@")[1];
            const thu = [
              `From: ${from}`, `To: ${to}`,
              "Subject: =?UTF-8?B?" + Buffer.from("Doi chung tu runner GitHub").toString("base64") + "?=",
              `Date: ${new Date().toUTCString()}`,
              `Message-ID: <${uuid}@${mien}>`,
              "MIME-Version: 1.0", "Content-Type: text/plain; charset=UTF-8", "",
              "Thu nay gui thang tu GitHub runner, khong di qua Cloudflare Worker.",
              `Message-ID: ${uuid}@${mien}`, "",
            ].join("\r\n");
            console.log(`→ (thân thư, Message-ID ${uuid}@${mien})`);
            s.write(thu + "\r\n.\r\n");
            const ket = await doi();
            console.log("← " + ket.trim());
            console.log("\nMÃ HÀNG ĐỢI (đưa cho hỗ trợ Hostinger để tra): " + ket.trim());
            s.write("QUIT\r\n");
            s.end();
          })().catch(e => { console.log("✗ hỏng: " + che(String(e))); process.exit(0); });
          EOF
          echo "--- đối thoại SMTP từ runner ---"
          timeout 60 node /tmp/gui-thang.cjs || echo "(hết giờ hoặc hỏng — xem dòng trên)"
          exit 0

      # Mở tail TRƯỚC khi gọi, vì thư gửi sau khi đã trả lời. Cả ba việc phải
      # nằm trong CÙNG một bước, không thì tiến trình nền chết theo bước trước.
      - name: Gọi thật rồi soi log Worker
        run: |
          npx wrangler tail --config worker/wrangler.toml --format json > /tmp/tail.log 2>&1 &
          TAIL_PID=$!
          echo "chờ tail kết nối…"; sleep 10

          # Thử ĐÚNG đường mà người dùng đi từ Đợt 5: /api/auth/otp gửi mã 6
          # số. Bản trước gọi /api/auth/email — đó là magic link của Đợt 2, vẫn
          # còn route nhưng không còn là lối chính, nên thử nó là thử nhầm chỗ:
          # nó xanh mà người dùng vẫn không nhận được mã.
          echo "--- POST /api/auth/otp (mã 6 số — lối chính) ---"
          ma=$(curl -s -o /tmp/tra.json -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' \
                 -d "{\"email\":\"$EMAIL_MOI\"}" \
                 https://k3vaceo.cuongngo.app/api/auth/otp)
          echo "HTTP $ma — $(cat /tmp/tra.json)"

          # Trả lời của /api/auth/otp giống hệt nhau dù email có thật hay không
          # (chống dò email), nên HTTP 200 KHÔNG chứng minh tìm thấy người. Đọc
          # thẳng D1 xem mã có được sinh ra không — đây mới là bằng chứng.
          echo "--- có sinh mã trong bảng otp_codes không ---"
          $WRANGLER --json --command \
            "SELECT COUNT(*) AS ma_vua_sinh FROM otp_codes o
               JOIN members m ON m.id = o.member_id
              WHERE m.email = '$EMAIL_MOI' AND o.created_at > datetime('now','-3 minutes')" \
            > /tmp/dem.json || true
          node --input-type=commonjs -e '
            const raw = require("fs").readFileSync("/tmp/dem.json", "utf8");
            const d = raw.search(/[\[{]/), c = Math.max(raw.lastIndexOf("]"), raw.lastIndexOf("}"));
            let n = -1;
            try {
              const kq = JSON.parse(raw.slice(d, c + 1));
              n = ((Array.isArray(kq) ? kq : [kq]).flatMap(x => (x && x.results) || [])[0] || {}).ma_vua_sinh;
            } catch (e) { console.log("(không đọc được:", String(e) + ")"); }
            if (n > 0) console.log(`✓ đã sinh ${n} mã — Worker TÌM THẤY người này và có gọi gửi thư`);
            else { console.log("✗ KHÔNG sinh mã nào — Worker không tìm thấy ai mang email này trong bảng members, nên không gửi gì cả"); }
            require("fs").writeFileSync("/tmp/co-ma", String(n));
          '

          echo "chờ Worker bắt tay SMTP xong (ctx.waitUntil chạy sau khi trả lời)…"
          sleep 30
          kill $TAIL_PID 2>/dev/null || true
          sleep 2

          # KHÔNG in nguyên log: nếu lúc này có người khác đang bấm magic link
          # thì URL chứa token sẽ lọt vào đây. Chỉ lấy đúng dòng cần, và che
          # mọi token dạng /dangnhap/... hoặc /i/... cho chắc.
          #
          # Phải PARSE JSON chứ đừng grep: console.error gọi với hai đối số nên
          # message là MẢNG hai chuỗi, grep tới dấu nháy đầu tiên là cắt mất
          # đúng câu lỗi — đã vấp một lần.
          cat > /tmp/doc-log.cjs <<'EOF'
          const fs = require("fs");
          const che = t => String(t).replace(/(dangnhap\/|\/i\/)[A-Za-z0-9_-]{8,}/g, "$1<token đã che>");
          const ra = [];
          for (const dong of fs.readFileSync("/tmp/tail.log", "utf8").split("\n")) {
            const i = dong.indexOf("{");
            if (i < 0) continue;
            let e; try { e = JSON.parse(dong.slice(i)); } catch { continue; }
            for (const l of e.logs || []) {
              const t = [].concat(l.message || []).map(x =>
                typeof x === "string" ? x : JSON.stringify(x)).join(" ");
              if (l.level === "error" || /thất bại|Error|SMTP/i.test(t)) ra.push(`[${l.level}] ${che(t)}`);
            }
            for (const x of e.exceptions || []) ra.push(`[exception] ${che(x.name)}: ${che(x.message)}`);
          }
          fs.writeFileSync("/tmp/loi.txt", ra.join("\n"));
          console.log(ra.length ? ra.join("\n") : "(không thấy lỗi nào trong log Worker)");
          EOF

          echo "--- log Worker trong lúc gửi ---"
          node /tmp/doc-log.cjs
          loi=$(cat /tmp/loi.txt)

          echo
          if [ "$ma" = "503" ]; then
            echo "::error::Worker trả 503 mailer_not_configured — thiếu bí mật: $(cat /tmp/thieu 2>/dev/null || echo 'xem bước liệt kê phía trên'). Thêm ở Cloudflare → Workers & Pages → k3vaceo-api → Settings → Variables and Secrets."
            exit 1
          fi
          if [ "$ma" != "200" ]; then
            echo "::error::Không gọi được /api/auth/email (HTTP $ma)."; exit 1
          fi
          if [ -n "$loi" ]; then
            echo "::error::Đủ bí mật SMTP nhưng gửi thư THẤT BẠI — xem dòng lỗi ở trên."; exit 1
          fi
          if [ "$(cat /tmp/co-ma 2>/dev/null)" = "0" ]; then
            echo "::error::Không sinh mã nào. Email '$EMAIL_MOI' không khớp dòng nào trong bảng members (hoặc dòng ấy is_active = 0). Đây chính là lý do không có thư về: Worker cố tình trả lời giống hệt như khi gửi thành công, để người ngoài không dò được ai đã đăng ký."
            exit 1
          fi
          echo "✓ Đủ bí mật SMTP, có sinh mã, và không thấy lỗi gửi."
          echo "  Kiểm tra hộp thư $EMAIL_MOI, CẢ MỤC SPAM."
          echo "  Thư tên 'Mã đăng nhập k3vaceo: <6 số>', mã sống 10 phút, dùng một lần." 
