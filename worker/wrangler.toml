name = "k3vaceo-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
# Cần cho @simplewebauthn/server (passkey, Đợt 3). Đây là cờ runtime, không
# phải bước build — vẫn deploy bằng đúng một lệnh `wrangler deploy`.
compatibility_flags = ["nodejs_compat"]

# rp.id của passkey — CỐ ĐỊNH VĨNH VIỄN theo mục 4.3 SRS. Đổi giá trị này là
# mọi passkey đã đăng ký chết sạch, không cứu được. Khi chạy cục bộ thì đặt
# RP_ID=localhost trong .dev.vars.
[vars]
RP_ID = "k3vaceo.cuongngo.app"

# Điền database_id thật sau khi chạy: npx wrangler d1 create k3vaceo
# (xem README.md ở gốc repo cho từng bước)
[[d1_databases]]
binding = "DB"
database_name = "k3vaceo"
database_id = "5b4d476b-fb4b-4bfa-97f3-59332b455290"
migrations_dir = "../migrations"

# Worker nhận /api/* trên tên miền thật. Zone cuongngo.app phải có sẵn trong
# tài khoản Cloudflare trước khi deploy, nếu không wrangler báo không tìm thấy
# zone — lỗi rõ ràng, cứ thêm domain vào Cloudflare rồi chạy lại.
[[routes]]
pattern = "k3vaceo.cuongngo.app/api/*"
zone_name = "cuongngo.app"

# Kiểm thử cục bộ cả API lẫn giao diện trên một cổng: thêm tạm khối dưới đây
# rồi `wrangler dev` — xem "Kiểm thử cục bộ" trong README.md. KHÔNG commit khối
# này khi bật — production thật là Pages tách riêng + Worker Route ở trên.
# [assets]
# directory = "../public"
# binding = "ASSETS"
# run_worker_first = true
